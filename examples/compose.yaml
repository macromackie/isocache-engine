name: isocache-example
services:
  postgres:
    image: postgres:17-alpine
    network_mode: bridge
    cpus: 1
    mem_limit: 256m
    labels:
      isocache.owner: local-example
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: example
    ports:
      - '127.0.0.1:55449:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U example -d example']
      interval: 1s
      timeout: 1s
      retries: 30
